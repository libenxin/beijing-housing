<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北京新房签约监测</title>
  <link rel="stylesheet" href="assets/style.css?v=49">
</head>
<body>
  <main class="page">
    <!-- 仅手机版 -->

    <!-- 首页：小区筛选列表 -->
    <section id="homeView">
      <header class="home-header">
        <div class="eyebrow"><span class="dot"></span> 北京新房签约监测</div>
        <h1>北京新房项目签约看板</h1>
        <div class="meta" id="homeMeta"></div>
      </header>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>筛选小区</h2>
            <p class="hint">支持名称搜索、所属区县和区位筛选，与北京市住建委官网保持一致。</p>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-item">
            <label>搜索名称</label>
            <input type="text" id="searchInput" placeholder="输入小区名称关键字..." class="filter-input">
          </div>
          <div class="filter-item">
            <label>所属区县</label>
            <select id="districtFilter" class="filter-select">
              <option value="">全部区县</option>
            </select>
          </div>
          <div class="filter-item">
            <label>区位</label>
            <select id="locationFilter" class="filter-select">
              <option value="">全部区位</option>
            </select>
          </div>
        </div>

        <div class="filter-stats" id="filterStats"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>项目列表</h2>
            <p class="hint">点击项目卡片进入详情，查看签约概览和楼栋房源详情。</p>
          </div>
        </div>
        <div class="project-grid" id="projectGrid"></div>
      </section>
    </section>

    <!-- 详情页：单个小区详情 -->
    <section id="detailView" style="display:none">
      <button class="back-btn" id="backBtn">← 返回项目列表</button>

      <header id="detailHeader">
        <div class="eyebrow"><span class="dot"></span> <span id="detailEyebrow">项目签约监测</span></div>
        <h1 id="detailTitle">项目名称</h1>
        <p class="subtitle" id="detailSubtitle"></p>
        <div class="meta" id="detailMeta"></div>
      </header>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>小区签约概览</h2>
          </div>
        </div>
        <div class="stats" id="overviewStats"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>近期成交情况</h2>

          </div>
        </div>
        <div id="dailyCompare"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>房源详情</h2>
          </div>
        </div>
        <div class="note">颜色说明：可售=浅绿，已成交/备案=浅灰；面积数字仅在政府网站有真实面积时显示。</div>
        <div class="legend" id="areaLegend"></div>
        <div class="building-list" id="buildingList"></div>
      </section>
    </section>

    <footer id="footer"></footer>
  </main>
  <script src="_shared/js/echarts.min.js"></script>
  <script src="assets/projects-data.js?v=50"></script>
<script src="assets/supabase-config.js?v=50"></script>
<script src="assets/app.js?v=50"></script>
