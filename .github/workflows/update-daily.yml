name: Daily Data Update

on:
  schedule:
    # 每天北京时间 08:17 自动运行（UTC 0:17，避开整点高峰）
    - cron: '17 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python tools/update_today_delta.py

      - name: Export static JSON for frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python tools/export_static_data.py

      - name: Commit & Push if data files changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B "$GITHUB_REF_NAME"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes, skip push"
            exit 0
          fi
          git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin "$GITHUB_REF_NAME"; then
              echo "push succeeded"
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1