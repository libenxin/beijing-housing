<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #0d1226;
    overflow: hidden;
    position: relative;
  }
  .glow1 { position: absolute; top: -180px; right: -160px; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(255,184,77,.25) 0%, rgba(255,184,77,0) 65%);
    border-radius: 50%; }
  .glow2 { position: absolute; bottom: -200px; left: -180px; width: 680px; height: 680px;
    background: radial-gradient(circle, rgba(56,120,255,.30) 0%, rgba(56,120,255,0) 65%);
    border-radius: 50%; }
  .wrap { position: relative; padding: 52px 72px 0; height: 1440px; display: flex; flex-direction: column; }

  .title { margin-top: 16px; color: #fff; font-size: 74px; font-weight: 900; line-height: 1.16; letter-spacing: 5px; }
  .title .accent { background: linear-gradient(90deg, #ffb84d, #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { margin-top: 14px; color: #8fa1c2; font-size: 25px; letter-spacing: 3px; }

  .step { margin-top: 34px; }
  .step-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .step-no {
    width: 46px; height: 46px; flex: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #2a1700;
    background: linear-gradient(135deg, #ffb84d, #ff8a3d);
  }
  .step-name { color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 1px; }
  .step-name small { color: #7e90b3; font-size: 21px; font-weight: 600; letter-spacing: 1px; margin-left: 10px; }

  .shot {
    background: #fff; border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    position: relative;
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .shot1 { height: 580px; }
  .shot2 { height: 212px; }
  .shot2 img { object-fit: cover; object-position: center; }
  .shot .cap {
    position: absolute; right: 14px; bottom: 12px;
    background: rgba(13,18,38,.72); color: #ffd9a0;
    font-size: 18px; letter-spacing: 1px; padding: 6px 14px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  .footer { margin-top: auto; padding-bottom: 48px; }
  .cta {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, #ff8a3d, #ffb84d);
    border-radius: 22px; padding: 28px 36px;
  }
  .cta .left { flex: 1; min-width: 0; color: #2a1700; font-size: 33px; font-weight: 900; letter-spacing: 2px; }
  .cta .left small { display: block; font-size: 21px; font-weight: 600; margin-top: 4px; opacity: .85; letter-spacing: 1px; white-space: nowrap; }
  .cta .arrow { flex: none; font-size: 44px; color: #2a1700; }
  .site { margin-top: 20px; text-align: center; color: #7e90b3; font-size: 23px; letter-spacing: 2px; }
  .site b { color: #ffb84d; font-weight: 700; }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="title">教你查出<br>网签备案<span class="accent">「底价」</span></div>
    <div class="subtitle">真实成交 · 逐套面积 · 免费可查</div>

    <div class="step">
      <div class="step-head">
        <div class="step-no">①</div>
        <div class="step-name">查楼栋<small>每栋剩余房源 · 每套真实面积</small></div>
      </div>
      <div class="shot shot1">
        <img src="file:///c:/Users/lbx18/.trae-cn/attachments/6aa2cbe32263a12013d339ab/5b4ae797-f94e-459b-bc82-ec9b241ec9b2_9b03e62f-79dc-4782-8338-9eca85ab4e8d_image.png">
        <div class="cap">绿色 = 可售 · 每套标面积</div>
      </div>
    </div>

    <div class="step">
      <div class="step-head">
        <div class="step-no">②</div>
        <div class="step-name">查成交<small>单套真实成交价 · 精确到元</small></div>
      </div>
      <div class="shot shot2">
        <img src="file:///c:/Users/lbx18/.trae-cn/attachments/6aa2cbe32263a12013d339ab/1bdf7f40-4fc0-4543-b58f-e5fe520d2a24_ae8a1e88-f419-4a66-a031-fcb43e30612f_image.png">
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        <div class="left">去试试 · 输入小区名就能查<small>楼盘逐栋 · 每日自动更新</small></div>
        <div class="arrow">→</div>
      </div>
    </div>
  </div>
</body>
</html>
